<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Synapse · ContextRelay</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>

  <div class="container">

    <!-- ── Header ─────────────────────────────────────────── -->
    <header class="header">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <span class="brand-name">Synapse</span>
        <span class="brand-sub">ContextRelay</span>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-lock" aria-label="Lock Synapse" title="Lock extension">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </button>
        <button class="icon-btn" id="btn-settings-toggle" aria-label="Toggle settings" title="Settings">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- ── Main Views ──────────────────────────────────────── -->
    <main class="views" id="main-views">

      <!-- Status View -->
      <section class="view view-status" id="view-status" aria-label="Status">
        <div class="stat-card">
          <div class="stat-label">Context Size</div>
          <div class="stat-value" id="token-counter">0</div>
          <div class="stat-unit">tokens</div>
        </div>
        <div class="badge-block">
          <span class="badge-label">Recommended Model</span>
          <span class="badge model-badge" id="recommended-model-badge">—</span>
        </div>
      </section>

      <!-- Action View -->
      <section class="view view-action" id="view-action" aria-label="Actions">
        <div class="field-group">
          <label class="field-label" for="model-select">Target Model</label>
          <div class="select-wrapper">
            <select id="model-select" class="select">
              <option value="">— select a model —</option>
              <optgroup label="Anthropic">
                <option value="claude-3-7-sonnet-20250219">Claude 3.7 Sonnet</option>
                <option value="claude-3-opus-20240229">Claude 3 Opus</option>
                <option value="__custom_anthropic__">Custom Anthropic…</option>
              </optgroup>
              <optgroup label="Google">
                <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                <option value="gemini-1.5-pro">Gemini 1.5 Pro</option>
                <option value="__custom_gemini__">Custom Gemini…</option>
              </optgroup>
              <optgroup label="OpenAI">
                <option value="gpt-4o">GPT-4o</option>
                <option value="gpt-4o-mini">GPT-4o Mini</option>
                <option value="o1">o1</option>
                <option value="__custom_openai__">Custom OpenAI…</option>
              </optgroup>
              <optgroup label="Groq">
                <option value="llama-3.3-70b-versatile">Llama 3.3 70B</option>
                <option value="llama-3.1-8b-instant">Llama 3.1 8B Instant</option>
              </optgroup>
            </select>
            <span class="select-chevron" aria-hidden="true">▾</span>
          </div>
        </div>

        <!-- Custom model string input (shown only when a Custom… option is selected) -->
        <div class="field-group" id="custom-model-group" hidden>
          <label class="field-label" for="custom-model-input">Custom Model ID</label>
          <input type="text" id="custom-model-input" class="input" placeholder="e.g. claude-3-5-haiku-20241022" autocomplete="off" spellcheck="false" />
        </div>

        <div class="relay-actions">
          <button class="btn-primary" id="btn-relay" aria-label="Relay context to selected model">
            <span class="btn-icon">⚡</span>
            Relay Context
          </button>
          <button class="btn-stop" id="btn-stop" aria-label="Stop generation" disabled>
            <span class="btn-icon">■</span>
            Stop
          </button>
        </div>

        <div class="status-bar" id="relay-status" aria-live="polite"></div>
      </section>

      <!-- Streaming Response Container -->
      <div id="response-container" class="response-container" hidden aria-live="polite" aria-label="Streamed AI response"></div>
      <div id="model-badge" class="model-fulfillment-badge" hidden></div>

    </main>

    <!-- ── Settings View ───────────────────────────────────── -->
    <aside class="view view-settings" id="view-settings" aria-label="Settings" hidden>
      <h2 class="settings-title">API Keys</h2>
      <p class="settings-hint">Keys are saved locally and never transmitted.</p>

      <div class="key-fields">

        <div class="field-group">
          <label class="field-label" for="key-gemini">Gemini API Key</label>
          <div class="input-wrapper">
            <input type="password" id="key-gemini" class="input" placeholder="AIza…" autocomplete="off" spellcheck="false" />
            <button class="reveal-btn" data-target="key-gemini" aria-label="Toggle Gemini key visibility">👁</button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="key-claude">Claude API Key</label>
          <div class="input-wrapper">
            <input type="password" id="key-claude" class="input" placeholder="sk-ant-…" autocomplete="off" spellcheck="false" />
            <button class="reveal-btn" data-target="key-claude" aria-label="Toggle Claude key visibility">👁</button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="key-openai">OpenAI API Key</label>
          <div class="input-wrapper">
            <input type="password" id="key-openai" class="input" placeholder="sk-…" autocomplete="off" spellcheck="false" />
            <button class="reveal-btn" data-target="key-openai" aria-label="Toggle OpenAI key visibility">👁</button>
          </div>
        </div>

        <div class="field-group">
          <label class="field-label" for="key-groq">Groq API Key</label>
          <div class="input-wrapper">
            <input type="password" id="key-groq" class="input" placeholder="gsk_…" autocomplete="off" spellcheck="false" />
            <button class="reveal-btn" data-target="key-groq" aria-label="Toggle Groq key visibility">👁</button>
          </div>
        </div>

      </div>

      <button class="btn-primary" id="btn-save-keys">Save Keys</button>
      <div class="status-bar" id="save-status" aria-live="polite"></div>
    </aside>

    <!-- ── Master PIN Lock Screen Overlay ───────────────────── -->
    <div class="lock-overlay" id="lock-screen" aria-modal="true" role="dialog" aria-labelledby="lock-title" hidden>
      <div class="lock-card">
        <div class="lock-icon-badge">
          <svg class="lock-svg" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
        </div>
        <h2 class="lock-title" id="lock-title">Unlock Synapse</h2>
        <p class="lock-subtitle" id="lock-subtitle">Enter your 4-digit Master PIN</p>

        <form id="pin-form" class="pin-form" autocomplete="off">
          <div class="pin-inputs" id="pin-inputs">
            <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" data-idx="0" autocomplete="off" aria-label="PIN digit 1" />
            <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" data-idx="1" autocomplete="off" aria-label="PIN digit 2" />
            <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" data-idx="2" autocomplete="off" aria-label="PIN digit 3" />
            <input type="password" inputmode="numeric" pattern="[0-9]*" maxlength="1" class="pin-digit" data-idx="3" autocomplete="off" aria-label="PIN digit 4" />
          </div>

          <div class="lock-status" id="lock-status" aria-live="polite"></div>

          <button type="submit" class="btn-primary lock-submit-btn" id="btn-lock-submit">Unlock</button>
        </form>
      </div>
    </div>

  </div>

  <script src="popup.js" type="module"></script>
</body>
</html>
